name: Public CMS Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: "27 8 * * *"

permissions:
  contents: read

jobs:
  public-cms-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check public CMS readiness
        run: |
          node <<'NODE'
          const { resolve4, resolveCname } = require('node:dns/promises');
          const fs = require('node:fs');

          const failures = [];
          const lines = ['# New Afro public CMS readiness', ''];

          function log(line = '') {
            console.log(line);
            lines.push(line);
          }

          function pass(message) {
            log(`PASS ${message}`);
          }

          function fail(message) {
            failures.push(message);
            log(`FAIL ${message}`);
          }

          function normalizeHost(value) {
            return value.replace(/\.$/, '');
          }

          async function dns(host, expectedCname) {
            log(`\n## DNS: ${host}`);
            let cnames = [];
            let addresses = [];
            try {
              cnames = await resolveCname(host);
            } catch {}
            try {
              addresses = await resolve4(host);
            } catch {}

            if (cnames.length) log(`CNAME ${cnames.join(', ')}`);
            if (addresses.length) log(`A ${addresses.join(', ')}`);

            if (!cnames.length && !addresses.length) {
              fail(`${host} has no public DNS result`);
              return false;
            }

            if (expectedCname && !cnames.map(normalizeHost).includes(expectedCname)) {
              fail(`${host} CNAME should include ${expectedCname}`);
              return false;
            }

            pass(`${host} resolves`);
            return true;
          }

          async function fetchText(url, options = {}) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 15000);
            try {
              const response = await fetch(url, {
                redirect: options.redirect || 'follow',
                signal: controller.signal,
                headers: { 'User-Agent': 'newafro-public-cms-readiness' },
              });
              const text = await response.text().catch(() => '');
              return { response, text };
            } finally {
              clearTimeout(timer);
            }
          }

          async function page(name, url, expected = []) {
            log(`\n## Page: ${name}`);
            try {
              const { response, text } = await fetchText(url);
              log(`${response.status} ${response.url}`);
              if (!response.ok) {
                fail(`${name} returned HTTP ${response.status}`);
                return;
              }
              for (const needle of expected) {
                if (!text.includes(needle)) {
                  fail(`${name} missing expected text: ${needle}`);
                  return;
                }
              }
              pass(`${name} is reachable`);
            } catch (error) {
              fail(`${name} failed: ${error.message}`);
            }
          }

          async function oauth(dnsReady) {
            log('\n## OAuth proxy');
            if (!dnsReady) {
              log('Skipped because decap-oauth.newafro.com has no DNS result.');
              return;
            }

            try {
              const health = await fetchText('https://decap-oauth.newafro.com/healthz');
              log(`health ${health.response.status} ${health.response.url}`);
              const payload = JSON.parse(health.text);
              if (!health.response.ok || payload.ok !== true) {
                fail(`OAuth health is not ready: ${health.text}`);
                return;
              }
            } catch (error) {
              fail(`OAuth health failed: ${error.message}`);
              return;
            }

            try {
              const auth = await fetchText('https://decap-oauth.newafro.com/auth?provider=github', {
                redirect: 'manual',
              });
              const location = auth.response.headers.get('location') || '';
              log(`auth ${auth.response.status} ${location}`);
              if (auth.response.status !== 302 || !location.startsWith('https://github.com/login/oauth/authorize')) {
                fail('OAuth auth endpoint does not redirect to GitHub authorize');
                return;
              }
            } catch (error) {
              fail(`OAuth auth failed: ${error.message}`);
              return;
            }

            pass('OAuth proxy is ready');
          }

          await dns('preview.newafro.com', 'newafro.github.io');
          await dns('login.newafro.com', 'newafro.github.io');
          const oauthDnsReady = await dns('decap-oauth.newafro.com');
          await page('Preview home', 'https://preview.newafro.com/', ['New Afro', 'Where art connects cultures.']);
          await page('Preview admin', 'https://preview.newafro.com/admin/', ['New Afro Studio']);
          await page('Friendly login', 'https://login.newafro.com/', ['https://preview.newafro.com/admin/']);
          await page('CMS config', 'https://preview.newafro.com/admin/config.yml', [
            'repo: newafro/website',
            'branch: staging',
            'base_url: https://decap-oauth.newafro.com',
            'label: "Journal"',
            'label: "Events"',
            'label: "Artists"',
          ]);
          await oauth(oauthDnsReady);

          log('\n## Summary');
          if (failures.length) {
            for (const failure of failures) log(`- ${failure}`);
            log('');
            log('Blocked by https://github.com/newafro/decap-oauth/issues/1');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
            process.exit(1);
          }

          log('All public CMS readiness checks passed.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE
