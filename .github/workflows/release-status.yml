name: Release Status

on:
  workflow_dispatch:
  schedule:
    - cron: "7 9 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging candidate
        uses: actions/checkout@v6
        with:
          ref: staging

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print release status
        env:
          GH_TOKEN: ${{ secrets.NEWAFRO_OPERATOR_TOKEN || github.token }}
        run: npm run status:release
