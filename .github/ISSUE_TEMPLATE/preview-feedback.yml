name: Preview feedback
description: Feedback on https://preview.newafro.com before production.
title: "[Preview feedback] "
labels:
  - website
  - preview
body:
  - type: input
    id: preview_url
    attributes:
      label: Preview URL
      placeholder: https://preview.newafro.com/...
    validations:
      required: true
  - type: dropdown
    id: page_area
    attributes:
      label: Page or area
      options:
        - Home
        - Menu / navigation
        - Archive
        - Events
        - Projects
        - Community
        - Agency
        - Contact / footer
        - CMS / login
        - Other
    validations:
      required: true
  - type: dropdown
    id: viewport
    attributes:
      label: Where did you see it?
      options:
        - Mobile
        - Desktop
        - Both mobile and desktop
        - Not viewport-specific
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What needs changing?
      description: Keep this visual and concrete. Screenshots, Figma links, Drive links, and WhatsApp context are useful.
      placeholder: "On mobile, the menu text is too large and the Archive first image is cropped too hard. Figma comment: ..."
    validations:
      required: true
  - type: dropdown
    id: decision
    attributes:
      label: Review decision
      options:
        - Fix before launch
        - Nice to improve
        - Missing asset
        - Approved
        - Needs changes
        - Approved for production
        - Needs missing content
        - Do not publish
    validations:
      required: true
  - type: textarea
    id: whatsapp_context
    attributes:
      label: WhatsApp context
      description: Optional paste of the original team message or bot summary.
    validations:
      required: false
